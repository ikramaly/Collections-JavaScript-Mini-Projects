<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Website</title>
    <link rel="stylesheet" href="crypto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

</head>
<body>
    <div class="container">
        <nav>
            <ul>
                <img src="icon.png" alt="">
                <li><a href="#">Market</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">White Papers</a></li>
                <li><a href="#">About Us</a></li>
            </ul>
            <button> EN </button>
        </nav>
        <div class="buy-sell">
            <h1><span>BUY</span> & <br> SELL <span>Crypto</span></h1>
            <p>
                World biggest Crypto Currency exchange avaliable<br> on web 
                as well as mobile phones.
            </p>
            <button> EXPLORE MORE</button>
        </div>
        <div class="bitcoin-img">
            <img src="crypto.jpg" alt="img">
        </div>
        <div class="current-price-bitcoin">
            <div class="price">
                <i class="fa-brands fa-bitcoin"></i>
                <div class="live-update">
                    <p> $24223</p>
                    <h4>Bitcoin</h4>
                </div>
            </div>
            <div class="price">
                <i class="fa-brands fa-ethereum"></i>
                <div class="live-update">
                    <p> $24223</p>
                    <h4>Ethereum</h4>
                </div>
            </div>
            <div class="price">
                <i class="fa-solid fa-shield-dog"></i>
                <div class="live-update">
                    <p> $24223</p>
                    <h4>Dogecoin</h4>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
