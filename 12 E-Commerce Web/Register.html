<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>
    <div class="login-page" id="login-pages">
        <button><a href="index.html"> Back </a></button>
        <div class="title">Registration</div>
        <form action="">
            <div class="user-details">
                <div>
                    <label class="fullname">Full Name</label>
                    <input type="text" name="name" id="fullname">
                </div>
                <div>
                    <label class="username">Username</label>
                    <input type="text" name="name" id="username">
                </div>
                <div>
                    <label class="Email">Email</label>
                    <input type="email" name="name" id="email">
                </div>
                <div>
                    <label class="phoneno">Phone No</label>
                    <input type="number" name="name" id="number">
                </div>
                <div>
                    <label class="Password">Password</label>
                    <input type="password" name="name" id="password">
                </div>
                <div>
                    <label class="password">Confirm Password</label>
                    <input type="password" name="name" id="password">
                </div>
            </div> 
            <div class="gender">
                <span>Gender</span>
                <div class="radio-div">
                    <div>
                        <label for="male">Male</label>
                        <input type="radio" name="radio" id="male">
                    </div>
                    <div>
                        <label for="female">Female</label>
                        <input type="radio" name="radio" id="female">
                    </div>
                    <div>
                        <label for="other">Prefer not to say</label>
                        <input type="radio" name="radio" id="other">
                    </div>
                </div>
                                <!-- register -->
            </div>
            <div class="register-btn" type="button">
                Register
            </div>

        </form>
     </div>

     <script src="index.js"></script>
</body>
</html>
