<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopUp Box</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="container">
        <button type="submit" class="btn" onclick="openPopup()">
            Submit
        </button>
        <div class="popup" id="popup">
            <img src="check.png" alt="img">
            <h2>Thank You!</h2>
            <p>
                Your details has been successfully
                submitted Thanks!
            </p>
            <button type="button" class="btn1" onclick="closePopup()">
                Ok
            </button>

        </div>

    </div>




    <script src="popup.js"></script>
</body>
</html>
