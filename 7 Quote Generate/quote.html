<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Of The Day</title>
    <link rel="stylesheet" href="quote.css">
</head>
<body>
    <div class="quote-container">
        <h1 id="quote-heading"> Quote of the day</h1>
        <p class="poem"></p>
        <h3 id="author-name"></h3>
        <div class="quote-tweet-div">
            <div class="quote-tweet" id="new-quote">
                New Quote
            </div>
            <div class="quote-tweet" id="twitter">
                <img src="tweet.png" alt="">
                <span>Tweet</span>
            </div>
        </div>
    </div>




    <script src="quote.js"></script>
</body>
</html>
